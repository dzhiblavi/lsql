name: Ubuntu

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and test Linux amd64 release
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Build Ubuntu 20.04 builder image
        run: make build-docker-linux-builder

      - name: Build and test
        run: make PROFILE=amd64-linux.docker build-docker-linux-Release

      - name: Package Linux amd64 release binaries
        run: |
          tar -czf output/logsql-linux-amd64-release.tar.gz \
            -C output \
            lsql-Release-linux-amd64 \
            lpipe-Release-linux-amd64

      - name: Publish Linux amd64 release archive
        uses: actions/upload-artifact@v4
        with:
          name: logsql-linux-amd64-release
          if-no-files-found: error
          path: output/logsql-linux-amd64-release.tar.gz
